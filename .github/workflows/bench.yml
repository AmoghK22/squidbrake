name: auto-mode bench

# Does Squidbrake's hook still run in each agent's auto / YOLO mode? (bench/auto-modes, with the mock model:
# no API keys.) Weekly, because the agents change their modes from release to release.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    paths: ["bench/auto-modes/**"]

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t squidbrake-bench bench/auto-modes
      - run: docker run --rm -e BENCH_TIMEOUT=120 squidbrake-bench
